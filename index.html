<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Kotwice HTML</title>
</head>

<body>

    <h1>Rodzaje kotwic</h1>

    <section>
        <h2 id="a_top">Tutaj zdefiniowaliśmy kotwicę o nazwie <i>a_top</i></h2>

        <p>
            <a href="#a_bottom">To jest link do kotwicy dolnej</a>
            <figure>
                <img src="kotwica1.jpg" alt="Kotwica Danfortha" width="400">
                <figcaption>Rysunek 1. Kotwica typu Danforth</figcaption>
            </figure>
        </p>
    </section>

    <section>
        <br><br>
        <p>
            Kotwice służą do unieruchamiania jednostek pływających.
            Poniżej przedstawiono dwa przykłady różnych rodzajów kotwic.
        </p>
    </section>

    <section>
        <a name="a_bottom"></a>
        <h2>Tutaj została zdefiniowana kotwica o nazwie <i>a_bottom</i></h2>

        <p>
            <a href="#a_top">To jest link do kotwicy górnej</a>
            <figure>
                <img src="kotwica2.jpg" alt="Kotwica pługowa" width="400">
                <figcaption>Rysunek 2. Kotwica pługowa</figcaption>
            </figure>
        </p>
    </section>

</body>
</html>
